[project]
name = "tropical-cyclones"
version = "26.11"
description = "Tropical Cyclones Classification with PyTorch"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.0",
    "numpy>=2.2.6",
    "plotly>=6.7.0",
    "pyarrow>=20.0.0",
    "torch>=2.12.0",
    "optuna>=4.8.0",
    "tensorboard>=2.20.0",
    "scikit-learn>=1.7.0",
    "imbalanced-learn>=0.13.0",
]

[project.scripts]
tropical-cyclones = "cli:main"
